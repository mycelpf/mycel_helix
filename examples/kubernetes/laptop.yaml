apiVersion: v1
kind: Namespace
metadata:
  name: helix-preview
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: helix-content
  namespace: helix-preview
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: helix
  namespace: helix-preview
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: helix
  template:
    metadata:
      labels:
        app: helix
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: helix
          image: mycelpf/mycel_helix:0.1.0-arm64.1
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 7373
          env:
            - name: HELIX_DEV_INSECURE
              value: "1"
            - name: HELIX_STORAGE_DIR
              value: /srv/.helix.storage
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
          volumeMounts:
            - name: content
              mountPath: /srv/.helix.storage
      volumes:
        - name: content
          persistentVolumeClaim:
            claimName: helix-content
---
apiVersion: v1
kind: Service
metadata:
  name: helix
  namespace: helix-preview
spec:
  type: ClusterIP
  selector:
    app: helix
  ports:
    - name: http
      port: 7373
      targetPort: http
